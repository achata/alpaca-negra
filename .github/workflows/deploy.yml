name: Alpaca Negra - Build & Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: alpaca-negra-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Docker ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/achata/alpaca-negra:${{ github.sha }}

  deploy:
    name: Deploy Kubernetes
    needs: build
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar Deployment
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/achata/alpaca-negra:${GITHUB_SHA}"

          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" \
            k8s/deployment.yaml | kubectl apply -f -

      - name: Verificar rollout
        run: |
          kubectl rollout status deployment/alpaca-negra --timeout=180s
          kubectl get pods -l app=alpaca-negra -o wide
          kubectl get svc alpaca-negra-service
