apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpaca-negra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpaca-negra
  template:
    metadata:
      labels:
        app: alpaca-negra
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alpaca-negra-service
spec:
  type: NodePort
  selector:
    app: alpaca-negra
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32321
      protocol: TCP
