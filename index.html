<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8ded0">
    <meta name="description" content="Alpaca Negra. Un retrato entre la luz y la niebla de los Andes.">
    <title>Pallqay! Hi! — Alpaca Negra</title>
    <link rel="preload" href="assets/bodoni-moda.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/alpaca-negra.css?v=marcha2">
    <script src="assets/alpaca-negra.js?v=marcha2" defer></script>
  </head>
  <body>
    <main>
      <section class="intro" id="inicio" aria-labelledby="titulo">
        <div class="portrait">
          <div class="portrait-scene">
            <img class="camera" src="assets/paso-andino.webp?v=marcha2" width="1280" height="720" fetchpriority="high" alt="Una alpaca de vellón negro camina de frente por un sendero andino.">
            <video class="camera portrait-film" data-src="assets/pasos-y-mirada.mp4?v=marcha2" muted playsinline aria-hidden="true"></video>
          </div>
          <div class="portrait-light" aria-hidden="true"></div>

          <header class="masthead">
            <a class="signature" href="#inicio" aria-label="Alpaca Negra, inicio">
              <span class="summits" aria-hidden="true"></span>
              <span>Alpaca<br>Negra</span>
            </a>
            <nav class="main-nav" aria-label="Navegación principal">
              <a href="#inicio" aria-current="location">Retrato</a>
              <a class="nav-pill" href="#andes">Los Andes</a>
            </nav>
          </header>

          <h1 class="wordmark" id="titulo"><span>Alpaca</span> <span>Negra</span></h1>

          <div class="portrait-scene portrait-overlap" aria-hidden="true">
            <img class="camera" src="assets/paso-andino.webp?v=marcha2" width="1280" height="720" alt="">
            <div class="portrait-light"></div>
          </div>

          <div class="greeting">
            <p class="greeting-title">Pallqay! <span lang="en">Hi!</span></p>
            <p>Un retrato en los Andes.</p>
          </div>

          <a class="explore" href="#andes">
            <span>Explorar</span>
            <span class="explore-rule" aria-hidden="true"></span>
          </a>

          <a class="scene-preview" href="assets/amanecer-en-los-andes.webp" data-gallery="paisaje" aria-label="Ampliar el paisaje andino">
            <span class="preview-frame preview-texture" aria-hidden="true"></span>
            <span class="preview-frame preview-mountains" aria-hidden="true"></span>
            <span class="preview-label">El paisaje <span aria-hidden="true">+</span></span>
          </a>
        </div>
        <span id="mirada" class="walk-end" aria-hidden="true"></span>
      </section>

      <section class="andes" id="andes" aria-labelledby="titulo-andes">
        <img class="andes-photo" src="assets/amanecer-en-los-andes.webp" width="1672" height="941" loading="lazy" alt="La alpaca negra camina sobre una ladera frente a las montañas cubiertas de niebla.">

        <div class="andes-content">
          <div class="andes-heading">
            <h2 id="titulo-andes">Entre la luz<br>y la niebla.</h2>
            <p>El amanecer dibuja el contorno de la alpaca mientras la niebla recorre la cordillera.</p>
          </div>

          <ul class="gallery" aria-label="Detalles del retrato andino">
            <li>
              <a class="gallery-card" href="assets/iris-electrico.webp" data-gallery="mirada">
                <span class="card-image card-eyes" aria-hidden="true"></span>
                <span class="card-label">La mirada <span class="card-plus" aria-hidden="true">+</span></span>
              </a>
            </li>
            <li>
              <a class="gallery-card" href="assets/retrato-andino.webp?v=marcha2" data-gallery="vellon">
                <span class="card-image card-fleece" aria-hidden="true"></span>
                <span class="card-label">El vellón <span class="card-plus" aria-hidden="true">+</span></span>
              </a>
            </li>
            <li>
              <a class="gallery-card" href="assets/amanecer-en-los-andes.webp" data-gallery="paisaje">
                <span class="card-image card-mountains" aria-hidden="true"></span>
                <span class="card-label">La cordillera <span class="card-plus" aria-hidden="true">+</span></span>
              </a>
            </li>
          </ul>
        </div>

        <footer class="site-footer">
          <a href="#inicio">Volver al retrato</a>
        </footer>
      </section>
    </main>

    <dialog class="viewer" id="visor" aria-labelledby="titulo-visor">
      <form method="dialog">
        <button class="viewer-close" aria-label="Cerrar imagen" autofocus>Cerrar <span aria-hidden="true">×</span></button>
      </form>
      <figure>
        <div class="viewer-frame"><img class="viewer-photo" alt=""></div>
        <figcaption id="titulo-visor"></figcaption>
      </figure>
    </dialog>
  </body>
</html>
